<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101b2a">
    <link rel="icon" href="data:,">
    <title>Aegis Grid</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Aegis Grid</h1>
        <div class="metrics" aria-label="Game status">
          <div><span>Credits</span><strong id="credits">120</strong></div>
          <div><span>Integrity</span><strong id="integrity">12</strong></div>
          <div><span>Wave</span><strong id="wave">0</strong></div>
        </div>
        <button id="mute" type="button" aria-label="Mute audio" aria-pressed="true">Sound off</button>
      </header>
      <section id="viewport" aria-label="Isometric battlefield"></section>
      <footer>
        <div class="feedback">
          <strong id="phase">Preparing grid</strong>
          <p id="status" role="status" aria-live="polite" aria-atomic="true">Initializing renderer…</p>
          <p id="help">Choose a turret, then click a blue pad or select a build pad below. The ring shows range from the pad center.</p>
        </div>
        <div class="controls" aria-label="Build and wave controls">
          <div class="build-controls">
            <label for="turret-type">Turret type</label>
            <select id="turret-type" disabled aria-describedby="help">
              <option value="basic">Basic · 40 credits · range 2.5</option>
              <option value="rail">Rail · 80 credits · range 4.5</option>
            </select>
            <label for="build-pad">Build pad</label>
            <select id="build-pad" disabled aria-describedby="help"><option>Loading pads…</option></select>
            <button id="build" type="button" disabled>Deploy turret</button>
          </div>
          <button id="start" type="button" disabled aria-describedby="wave-help">Start wave</button>
          <button id="restart" type="button" hidden>Try again</button>
        </div>
        <p id="wave-help">Deploy defenses, then start a wave. You can also build during a wave.</p>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
